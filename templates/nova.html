<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova - Voice Assistant</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
      background: #f0f4f8;
    }
    h1 {
      color: #333;
    }
    input, button {
      font-size: 1rem;
      padding: 0.5rem;
      margin: 0.5rem;
      width: 250px;
    }
    #response {
      margin-top: 1.5rem;
      font-weight: bold;
    }
    #mic {
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎙️ Nova - Voice Assistant</h1>
  
  <input type="text" id="query" placeholder="Ask Nova something..." />
  <button onclick="askNova()">Ask</button>
  <br>
  <button id="mic" onclick="startListening()">🎤</button>

  <div id="response"></div>

  <script>
    async function askNova() {
      const query = document.getElementById("query").value.trim();
      if (!query) return;

      const responseDiv = document.getElementById("response");

      const res = await fetch("/nova", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ query })
      });

      const data = await res.json();
      const reply = data.response;
      responseDiv.textContent = "Nova: " + reply;

      // Speak the response using browser TTS
      const synth = window.speechSynthesis;
      const utter = new SpeechSynthesisUtterance(reply);
      synth.speak(utter);
    }

    function startListening() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        document.getElementById("query").placeholder = "Listening...";
      };

      recognition.onerror = (event) => {
        alert("Error: " + event.error);
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById("query").value = transcript;
        askNova();
      };

      recognition.onend = () => {
        document.getElementById("query").placeholder = "Ask Nova something...";
      };

      recognition.start();
    }
  </script>
</body>
</html>
