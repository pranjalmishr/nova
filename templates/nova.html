<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.O.V.A - Voice Assistant</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #000011, #001933);
      background-size: 400% 400%;
      animation: bgShift 20s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .dot {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: #00bfff;
      box-shadow:
        0 0 80px #00bfff,
        0 0 120px #00bfff,
        0 0 180px #00bfff,
        inset 0 0 60px #00bfff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 80px #00bfff,
          0 0 120px #00bfff,
          0 0 180px #00bfff,
          inset 0 0 60px #00bfff;
      }
      50% {
        transform: scale(1.05);
        box-shadow:
          0 0 100px #00bfff,
          0 0 150px #00bfff,
          0 0 220px #00bfff,
          inset 0 0 80px #00bfff;
      }
    }

    .dot span {
      font-size: 22px;
      letter-spacing: 5px;
      font-weight: bold;
      color: #001a33;
      text-shadow:
        0 0 10px #66e0ff,
        0 0 20px #66e0ff;
    }

    .input-container {
      width: 320px;
      margin-top: 50px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      background-color: rgba(10, 15, 26, 0.7);
      color: #00bfff;
      border: 1px solid #00bfff;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
    }

    input[type="text"]::placeholder {
      color: #008fd1aa;
    }
  </style>
  <script>
    function speak(text) {
      const synth = window.speechSynthesis;
      const utterThis = new SpeechSynthesisUtterance(text);
      synth.speak(utterThis);
    }

    function sendCommand() {
      const input = document.getElementById("commandInput");
      const command = input.value;

      fetch("/nova", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ command })
      })
        .then(response => response.json())
        .then(data => {
          speak(data.reply);
          if (data.url) {
            window.open(data.url, "_blank");
          }
          input.value = "";
        });
    }
  </script>
</head>
<body>
  <h1>N.O.V.A - Voice Assistant</h1>
  <input type="text" id="commandInput" placeholder="Say something..." />
  <button onclick="sendCommand()">Send</button>
</body>
</html>
